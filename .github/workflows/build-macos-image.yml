name: Build Sequoia ISO

on:
  workflow_dispatch:

jobs:
  build-sequoia-iso:
    runs-on: macos-15-intel
    timeout-minutes: 80
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          df -h "$(mktemp -d)"

      - name: Create macOS Sequoia ISO
        id: create_image
        run: |
          ./mkmaciso "Sequoia" "iso"
          iso=$(basename *.iso)
          echo "image_name=$iso" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$iso" | tee "$iso.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ steps.create_image.outputs.image_name }}
            ${{ steps.create_image.outputs.image_name }}.sha256
          compression-level: 0
          retention-days: 3
          archive: false
